name: Release standalone binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: npm install

      - name: Build standalone binaries
        run: npm run build

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/standalone/elysia-api-windows-amd64.exe
          test -f dist/standalone/elysia-api-linux-amd64
          test -f dist/standalone/elysia-api-darwin-amd64
          test -f dist/standalone/elysia-api-darwin-arm64
          cd dist/standalone
          sha256sum \
            elysia-api-windows-amd64.exe \
            elysia-api-linux-amd64 \
            elysia-api-darwin-amd64 \
            elysia-api-darwin-arm64 > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${GITHUB_REF_NAME} \
            dist/standalone/elysia-api-windows-amd64.exe \
            dist/standalone/elysia-api-linux-amd64 \
            dist/standalone/elysia-api-darwin-amd64 \
            dist/standalone/elysia-api-darwin-arm64 \
            dist/standalone/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title ${GITHUB_REF_NAME}
