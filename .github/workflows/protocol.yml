name: Protocol fidelity

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      deep_checks:
        description: 'Also run repeated stress, timed fuzzing and benchmarks'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOFLAGS: -p=2
      GOMAXPROCS: '2'
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/verification/backend.test.mjs scripts/verification/runner.test.mjs
      - run: go vet ./...
        working-directory: backend
        env:
          GOFLAGS: -p=1
          GOMEMLIMIT: 1GiB
      - name: Full non-race suite (bounded independent server shards)
        run: node scripts/verify-protocol.mjs check --suite=all --jobs=4
      - id: protocol-race
        run: |
          echo "evidence-dir=$(realpath -m ../.cache)" >> "$GITHUB_OUTPUT"
          node scripts/verify-protocol.mjs race
      - name: Fixed-duration compiler, JSON and event fuzzing
        if: github.event_name == 'workflow_dispatch' && inputs.deep_checks
        working-directory: backend
        run: |
          for target in FuzzCompileDefinition FuzzJSONMappingPresence FuzzJSONResourceLimits FuzzJSONContainers FuzzEventReplay FuzzTypedLimitEquivalence; do
            go test ./protocol -run '^$' -fuzz "^${target}$" -fuzztime=20s -parallel=2
          done
      - name: Reload, task recovery and cancellation stress
        if: github.event_name == 'workflow_dispatch' && inputs.deep_checks
        run: node scripts/verify-protocol.mjs race --stress-only
      - run: go test ./protocol/builtin -run '^$' -bench 'BenchmarkCacheConversion|BenchmarkStreamTextDecode' -benchmem -count=3
        if: github.event_name == 'workflow_dispatch' && inputs.deep_checks
        working-directory: backend
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-non-race-evidence
          path: ../.cache/protocol-check-*/
      - uses: actions/upload-artifact@v4
        if: always() && steps.protocol-race.outputs.evidence-dir != ''
        with:
          name: protocol-race-evidence
          path: ${{ steps.protocol-race.outputs.evidence-dir }}/protocol-race-*/

  editor-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: packages/webui
      - run: npx playwright install --with-deps chromium
        working-directory: packages/webui
      - run: node scripts/test-protocol-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: protocol-browser-failures
          path: packages/webui/test-results
