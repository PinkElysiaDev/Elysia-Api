<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Elysia API banner">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feFlood flood-color="#FF3DCC" result="c"/>
      <feComposite in="c" in2="SourceAlpha" operator="in" result="cg"/>
      <feGaussianBlur in="cg" stdDeviation="5" result="b"/>
      <feComponentTransfer in="b" result="e"><feFuncA type="linear" slope="1.4"/></feComponentTransfer>
      <feMerge><feMergeNode in="e"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tglow" x="-10%" y="-40%" width="120%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FF40FF" flood-opacity="0.35"/>
    </filter>
    <path id="op" d="M 0,-46 L -6,-52 L -11,-74 L 0,-104 L 11,-74 L 6,-52 Z"/>
    <path id="ip" d="M 0,-12 L -5,-26 L 0,-44 L 5,-26 Z"/>
    <path id="shard" d="M 0,-56 L 5.5,-63 L 0,-70 L -5.5,-63 Z"/>
    <path id="spk" d="M 106,-6 L 134,0 L 106,6 Z"/>
    <path id="spark" d="M 0,-7 L 1.8,-1.8 L 7,0 L 1.8,1.8 L 0,7 L -1.8,1.8 L -7,0 L -1.8,-1.8 Z"/>
  </defs>

  <g fill="#FF77FF">
    <use href="#spark" transform="translate(405,72)" opacity="0.85"/>
    <use href="#spark" transform="translate(878,54) scale(0.7)" opacity="0.7"/>
    <use href="#spark" transform="translate(336,224) scale(0.55)" opacity="0.6"/>
    <use href="#spark" transform="translate(948,196) scale(0.9)" opacity="0.8"/>
    <use href="#spark" transform="translate(560,36) scale(0.45)" opacity="0.5"/>
  </g>

  <g transform="translate(640,116) scale(0.72)">
    <g filter="url(#glow)">
      <g fill="none" stroke="#F2A7DE" stroke-width="5">
        <path d="M 90.1,-63.1 A 110,110 0 0 1 28.5,106.3"/>
        <path d="M -46.5,99.7 A 110,110 0 0 1 -99.7,-46.5"/>
        <path d="M -46.5,-99.7 A 110,110 0 0 1 46.5,-99.7"/>
      </g>
      <g fill="none" stroke="#F2A7DE" stroke-width="2.5" opacity="0.85">
        <path d="M 96,0 A 96,96 0 0 1 55.1,78.7"/>
        <path d="M -116.5,42.4 A 124,124 0 0 1 -87.7,-87.7"/>
      </g>
      <g fill="#F2A7DE">
        <use href="#spk"/>
        <use href="#spk" transform="rotate(55)"/>
        <use href="#spk" transform="rotate(130)"/>
        <use href="#spk" transform="rotate(185)"/>
        <use href="#spk" transform="rotate(235)"/>
        <use href="#spk" transform="rotate(300)"/>
      </g>
      <g fill="#FFFFFF">
        <use href="#op"/>
        <use href="#op" transform="rotate(90)"/>
        <use href="#op" transform="rotate(180)"/>
        <use href="#op" transform="rotate(270)"/>
        <use href="#ip"/>
        <use href="#ip" transform="rotate(90)"/>
        <use href="#ip" transform="rotate(180)"/>
        <use href="#ip" transform="rotate(270)"/>
        <use href="#shard" transform="rotate(45)"/>
        <use href="#shard" transform="rotate(135)"/>
        <use href="#shard" transform="rotate(225)"/>
        <use href="#shard" transform="rotate(315)"/>
        <path d="M -6.5,-3 L 6.5,-3 L 0,9 Z"/>
      </g>
    </g>
  </g>

  <text x="640" y="262" text-anchor="middle" filter="url(#tglow)"
        font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="56" font-weight="650" letter-spacing="10" fill="#FFFFFF">Elysia API</text>
  <text x="640" y="300" text-anchor="middle"
        font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="17" font-weight="500" letter-spacing="7" fill="#FFA8DC">LIGHTWEIGHT · SELF-HOSTED · AI GATEWAY</text>
</svg>
