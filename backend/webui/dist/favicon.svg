<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="elysia-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feFlood flood-color="#ff00ff" result="glowColor" />
      <feComposite in="glowColor" in2="SourceAlpha" operator="in" result="coloredGlow" />
      <feGaussianBlur in="coloredGlow" stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="enhancedGlow">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="enhancedGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="100" height="100" fill="#ff00ff" rx="20"/>

  <!-- White rose/flower design with glow effect -->
  <g filter="url(#elysia-glow)">
    <!-- Outer spiked frame elements -->
    <path d="M20 15 L15 20 L12 15 L8 18 L10 12 L5 10 L10 8 L8 2 L12 5 L15 0 L20 5 L25 0 L28 5 L32 2 L30 8 L35 10 L30 12 L32 18 L28 15 L25 20 L20 15 Z"
          fill="#ffffff" opacity="0.8"/>
    <path d="M50 5 L52 12 L58 8 L55 15 L62 15 L56 20 L60 27 L53 24 L50 30 L47 24 L40 27 L44 20 L38 15 L45 15 L42 8 L48 12 Z"
          fill="#ffffff" opacity="0.8"/>
    <path d="M80 15 L75 20 L72 15 L68 18 L70 12 L65 10 L70 8 L68 2 L72 5 L75 0 L80 5 L85 0 L88 5 L92 2 L90 8 L95 10 L90 12 L92 18 L88 15 L85 20 L80 15 Z"
          fill="#ffffff" opacity="0.8"/>
    <path d="M20 85 L15 80 L12 85 L8 82 L10 88 L5 90 L10 92 L8 98 L12 95 L15 100 L20 95 L25 100 L28 95 L32 98 L30 92 L35 90 L30 88 L32 82 L28 85 L25 80 L20 85 Z"
          fill="#ffffff" opacity="0.8"/>
    <path d="M80 85 L75 80 L72 85 L68 82 L70 88 L65 90 L70 92 L68 98 L72 95 L75 100 L80 95 L85 100 L88 95 L92 98 L90 92 L95 90 L90 88 L92 82 L88 85 L85 80 L80 85 Z"
          fill="#ffffff" opacity="0.8"/>

    <!-- Central rose petals - outer layer -->
    <path d="M50 25 Q35 30 30 45 Q28 55 35 62 Q32 50 35 42 Q40 32 50 28 Z"
          fill="#ffffff"/>
    <path d="M50 25 Q65 30 70 45 Q72 55 65 62 Q68 50 65 42 Q60 32 50 28 Z"
          fill="#ffffff"/>
    <path d="M30 50 Q25 60 28 72 Q35 78 45 75 Q38 70 33 62 Q28 52 30 45 Z"
          fill="#ffffff"/>
    <path d="M70 50 Q75 60 72 72 Q65 78 55 75 Q62 70 67 62 Q72 52 70 45 Z"
          fill="#ffffff"/>

    <!-- Middle layer petals -->
    <path d="M50 32 Q42 35 38 45 Q37 52 42 58 L50 50 Z"
          fill="#ffffff" opacity="0.95"/>
    <path d="M50 32 Q58 35 62 45 Q63 52 58 58 L50 50 Z"
          fill="#ffffff" opacity="0.95"/>
    <path d="M38 50 Q35 56 37 64 Q42 68 50 65 L50 55 Z"
          fill="#ffffff" opacity="0.95"/>
    <path d="M62 50 Q65 56 63 64 Q58 68 50 65 L50 55 Z"
          fill="#ffffff" opacity="0.95"/>

    <!-- Inner petals -->
    <path d="M50 38 L45 48 L50 50 L55 48 Z"
          fill="#ffffff" opacity="0.9"/>
    <path d="M50 62 L45 52 L50 50 L55 52 Z"
          fill="#ffffff" opacity="0.9"/>
    <path d="M42 50 L48 45 L50 50 L48 55 Z"
          fill="#ffffff" opacity="0.9"/>
    <path d="M58 50 L52 45 L50 50 L52 55 Z"
          fill="#ffffff" opacity="0.9"/>

    <!-- Diagonal accent petals -->
    <path d="M44 44 L47 47 L50 46 L48 43 Z"
          fill="#ffffff" opacity="0.85"/>
    <path d="M56 44 L53 47 L50 46 L52 43 Z"
          fill="#ffffff" opacity="0.85"/>
    <path d="M44 56 L47 53 L50 54 L48 57 Z"
          fill="#ffffff" opacity="0.85"/>
    <path d="M56 56 L53 53 L50 54 L52 57 Z"
          fill="#ffffff" opacity="0.85"/>

    <!-- Central core -->
    <circle cx="50" cy="50" r="4" fill="#ffffff" opacity="0.95"/>
    <circle cx="50" cy="50" r="2" fill="#ff00ff"/>

    <!-- Bottom stem detail -->
    <path d="M48 65 Q48 75 46 82 L54 82 Q52 75 52 65 Z"
          fill="#ffffff" opacity="0.7"/>
    <path d="M40 72 Q38 70 36 72 L35 75 Q37 73 40 75 Z"
          fill="#ffffff" opacity="0.6"/>
    <path d="M60 72 Q62 70 64 72 L65 75 Q63 73 60 75 Z"
          fill="#ffffff" opacity="0.6"/>
  </g>
</svg>